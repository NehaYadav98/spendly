{% extends "base.html" %}

{% block title %}Edit Profile — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit your profile</h1>
            <p class="auth-subtitle">Update your name and email address</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_profile') }}">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name"
                           class="form-input"
                           value="{{ request.form.get('name', user.name) }}"
                           maxlength="100" required autofocus>
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           class="form-input"
                           value="{{ request.form.get('email', user.email) }}"
                           maxlength="254" required>
                </div>
                <div class="form-group">
                    <label for="current_password">Current password (only needed to change your email)</label>
                    <input type="password" id="current_password" name="current_password"
                           class="form-input" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit">Save Changes</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">Cancel and go back</a>
        </p>

    </div>
</section>

{% endblock %}
